bot:
  name: moose            # display name only; mentions are matched by bot user ID
slack:
  port: 3000
  allowedChannels: []    # empty = all channels the bot is in
  allowedUsers: []       # empty = everyone
  allowPrivateChannels: false  # true: also record private-channel threads (bot invited; groups:read + groups:history).
  #                            # KB entries are visible to everyone who can search the KB. DMs are never recorded.
skills:
  disabled: []           # leave skills out: kb-collect, kb-files, kb-ask (e.g. [kb-ask] while answers are not good enough)
  #                      # or env NEOTAGS_DISABLED_SKILLS=kb-ask,kb-files. Unknown names fail at startup.
onyx:
  baseUrl: https://onyx.example.com
  ingestionPath: /api/ingestion
  searchPath: /api/search   # used by kb-ask; the API key also needs READ_SEARCH
  ccPairId: 1
  maxResults: 8             # sections fetched from Onyx per question
attachments:             # Slack files (PDF, DOCX, XLSX, PPTX, text, HTML) read into the KB
  enabled: true          # false: files are never downloaded (kb-files is disabled; kb-collect ignores them)
  maxFileMb: 25
  maxFiles: 10           # per request; the rest are reported as skipped
  maxTextChars: 600000   # extracted text kept per file
  summarize: true       # one LLM call per file: description, contents and key facts stored with its text
llm:                     # any OpenAI-compatible gateway (OpenAI, LiteLLM, vLLM, ...)
  baseUrl: https://api.openai.com/v1   # or env LLM_BASE_URL
  model: gpt-4o-mini                   # or env LLM_MODEL (required once an LLM skill runs)
  # routerModel: <fast model>          # or env LLM_ROUTER_MODEL; smaller/faster model for intent routing
  #                                    # (same gateway and key). Defaults to `model`.
  # Models per use with a reasoning effort each (replaces model / routerModel when set). Chains: agent
  # (tool-using runs), job (scheduled judgements), gate (fast decisions, intent routing), summary (summaries,
  # kb-ask answers). Entries are tried in order; one whose breaker is open is skipped. effort: none | low |
  # medium | high | max (unset = send no reasoning setting); finalEffort: last step of an agent run.
  # models:
  #   fast:
  #     id: <gateway model id>
  #     reasoning: true
  #     compat: { thinkingFormat: deepseek, supportsReasoningEffort: true }   # how the effort is sent (pi-ai)
  #     thinkingLevelMap: { max: max }   # gateway value per level (null = unsupported); agents need "max" mapped
  #     effortBody: { none: { chat_template_kwargs: { enable_thinking: false } } }   # extra fields per effort
  # chains:
  #   agent:   [{ model: fast, effort: high, finalEffort: max }]
  #   job:     [{ model: fast, effort: high }]
  #   gate:    [{ model: fast, effort: none }]
  #   summary: [{ model: fast, effort: low }]
  # failover:
  #   firstTokenTimeoutSec: 30   # agent runs: a streamed request with no first token by then is retried
  #   breaker: { failures: 5, windowSec: 60, cooldownSec: 120 }   # per model; open = calls fail fast
  # Reasoning models (DeepSeek, Qwen3, ...) can spend a whole small max_tokens thinking and return no answer.
  # The client retries once with a bigger budget (up to maxTokens). If your gateway can turn thinking off,
  # add its switch to every request, e.g.:
  # extraBody: { chat_template_kwargs: { enable_thinking: false } }   # or env LLM_EXTRA_BODY (JSON)
  # compat:                              # gateway quirks (pi-ai compat)
  #   supportsDeveloperRole: false       #   default; true sends the system prompt as role "developer" for
  #                                      #   reasoning models (OpenAI accepts it; many gateways silently drop it)
  # contextWindow: 128000                # or env LLM_CONTEXT_WINDOW; the model's context size (tokens)
  # maxTokens: 8192                      # or env LLM_MAX_TOKENS; ceiling for a single reply
  # temperature: 0                       # null = send none (for models that only accept their own default)
  # outputTokens:                        # output budget per kind of call (reasoning models need headroom)
  #   router: 200                        #   pick a skill
  #   notes: 1500                        #   notes for one part of a long thread
  #   summary: 3000                      #   thread summary
  #   fileSummary: 1200                  #   description / contents / key facts of a file
  #   answer: 1200                       #   kb-ask answer
  # summarizeMaxInputTokens: 60000       # prompt budget; default = contextWindow / 2 - outputTokens.summary
  # charsPerToken: 4                     # lower (e.g. 2-3) for CJK-heavy text so budgets are not overrun
# Tool-using agent runs (RunManager), started when o2Gateway is enabled.
# agent:
#   entries: { o2: [o2-query-assistant] }   # skill packs in the system prompt per entry (must be in skillPacks.packs)
#   maxSteps: 30                  # tool-calling turns, then the model answers with what it has
#   wallClockSec: { slack: 360, o2: 600, job: 600 }
#   finalReserveSec: 90           # the last seconds of the wall clock are kept for the final answer
#   maxInputTokens: 100000        # prompt budget per request; the oldest tool outputs are stubbed out first
#   concurrency: { total: 4, perUserPerHour: 20, exemptUsers: [] }   # exemptUsers: emails not counted per hour (eval runner)
#   drainSec: 640                 # on shutdown; keep below terminationGracePeriodSeconds
# skillPacks:                     # Agent Skills (<pack>/SKILL.md + references/), mounted read-only
#   dir: /etc/neotags/skills
#   packs: [o2-query-assistant]   # whole packs: SKILL.md + every text file under references/
#   refs:                         # single reference files of other packs, relative to references/
#     some-pack: [method.md, data/table.json]
# o2Gateway:                      # the OpenObserve AI assistant entry (docs/design/002-o2-gateway-contract.md)
#   enabled: false                # needs env O2_AGENT_API_KEY (the x-o2-agent-key O2 sends) and an LLM
#   port: 3001                    # its own port; in-cluster callers only (Service + NetworkPolicy)
#   orgs: {}                      # O2 org identifier -> the mcp.servers entry that queries it, e.g. { default: o2 }
#   auth: service                 # service: every org with the servers' headers. user: as the asker, with O2's
#                                 # x-o2-user-token, page org only; no token -> 503 user_auth_unavailable
#   minUserTokenSec: 120          # auth user: less token life than this (after a 30 s margin) -> refused, ask again
#   maxBodyKb: 4096
#   maxHistoryChars: 48000        # earlier turns kept, newest first
#   maxQueued: 8                  # runs waiting for a slot; beyond it O2 gets 429 turn_limit
# sandbox:                        # where skill-pack commands run (executor/README.md); nothing runs in this process
#   backend: none                 # none (default): every execution is refused. local: the executor sidecar
#   socket: /run/executor/exec.sock
#   maxConcurrency: 4             # calls in flight; the executor's EXECUTOR_MAX_CONCURRENCY (the chart sets it)
#   queueTimeoutSec: 30           # longest wait for a slot, then the call fails as busy (not run)
telemetry:               # LLM traces over OTLP/HTTP (OpenObserve, Langfuse, an OTel collector): one trace per
  #                      # request, one span per LLM call with model, tokens, latency, retries. Off unless
  #                      # OTEL_EXPORTER_OTLP_TRACES_ENDPOINT (or OTEL_EXPORTER_OTLP_ENDPOINT) is set; auth via
  #                      # OTEL_EXPORTER_OTLP_HEADERS. See README "LLM traces".
  captureContent: false  # true: prompts, replies and tool input/output on spans (redacted; readable by anyone who
  #                      # can read the traces). Or env OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true
logLevel: info
# Secrets come from env: SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET, ONYX_API_KEY, LLM_API_KEY (optional if the gateway needs none),
# O2_AGENT_API_KEY (with o2Gateway.enabled)
