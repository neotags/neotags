title = "neotags gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "synthetic fixtures used by tests, docs, and example config"
stopwords = [
  "xoxb-fake",
]
paths = [
  '''\.env\.example''',
  '''package-lock\.json''',
]

# Synthetic secrets used as fixtures for the redaction tests. Scoped to these rules and this file only.
[[allowlists]]
description = "redaction test fixtures"
targetRules = ["curl-auth-header", "generic-api-key", "github-pat"]
paths = ['''test/tools\.test\.ts''']
