name: Build Executor Image

# Builds the executor sidecar image (executor/, linux/amd64 + linux/arm64) and
# pushes it to GitHub Container Registry as neotags-executor, using the
# built-in GITHUB_TOKEN. executor-check.yml runs first on both platforms
# (Trivy and the sandbox tests); nothing is pushed unless it passes. The push
# reuses the build cache those checks wrote, then the pushed image is scanned
# again. Runs on free GitHub-hosted runners (public repo). Pull requests get
# the same checks from ci.yml.

on:
  push:
    branches: [main]
    paths:
      - executor/**
      - .github/workflows/build-executor-image.yml
      - .github/workflows/executor-check.yml
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (e.g., feature/my-branch)'
        required: true
        default: main
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A push checks and builds github.sha, so a later push to main can't slip in
  # between the two jobs. A manual run takes the branch's head at each job's
  # checkout.
  check:
    uses: ./.github/workflows/executor-check.yml
    with:
      ref: ${{ inputs.branch || github.sha }}

  build:
    name: build & push
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Clone the current repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      # Same tag scheme as the neotags image (build-image.yml).
      - name: Set image tag
        id: meta
        run: |
          GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          GIT_HASH=$(git rev-parse --short=7 HEAD)
          TAG="${GIT_TAG}-${GIT_HASH}"
          # GHCR requires a lowercase repository path
          REPO=$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/neotags-executor" | tr '[:upper:]' '[:lower:]')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${REPO}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reads the per-platform caches written by executor-check.yml. With the
      # same commit and the digest-pinned base, every layer is a cache hit, so
      # the pushed layers are the ones that were scanned and tested; a cache
      # miss (for example, an evicted entry) rebuilds them, and the scan
      # below still covers amd64. No cache-to: this job must not replace them.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: executor
          target: runtime
          tags: ${{ steps.meta.outputs.image }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha,scope=executor-amd64
            type=gha,scope=executor-arm64

      # The checks already scanned both platforms before the push; this scans
      # what was pushed, for the runner's arch.
      - name: Scan pushed image for fixed vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
