name: Executor Check

# Reusable checks for the executor image (executor/), on each platform's own
# runner: Trivy scan of the runtime image, then the sandbox tests on the test
# image without /proc (mode 3) and with a private /proc (mode 1). Never pushes
# and needs no secrets, so ci.yml can call it on pull requests. Each platform
# writes its build cache to its own GHA scope; build-executor-image.yml builds
# the pushed image from those scopes, so it reuses the layers checked here.

on:
  workflow_call:
    inputs:
      ref:
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Tests run natively only: under emulation they fail by design, because the
    # seccomp filter allows only the image's native syscall ABI.
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Clone the current repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: executor
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: neotags-executor:check
          cache-from: type=gha,scope=executor-${{ matrix.arch }}
          cache-to: type=gha,scope=executor-${{ matrix.arch }},mode=max

      # Same gate as the neotags image (build-image.yml): only fixed HIGH and
      # CRITICAL vulnerabilities fail the job.
      - name: Scan runtime image for fixed vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: neotags-executor:check
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: executor
          target: test
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: neotags-executor:test
          cache-from: type=gha,scope=executor-${{ matrix.arch }}

      # Ubuntu 24.04 lets only AppArmor-profiled programs create unprivileged
      # user namespaces, which bubblewrap needs.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Sandbox tests without /proc (mode 3)
        run: |
          docker run --rm --read-only --tmpfs /tmp:exec \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e EXECUTOR_REQUIRE_SANDBOX=1 neotags-executor:test

      - name: Sandbox tests with a private /proc (mode 1)
        run: |
          docker run --rm --read-only --tmpfs /tmp:exec \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            -e EXECUTOR_REQUIRE_SANDBOX=1 -e EXECUTOR_REQUIRE_PROCFS=1 neotags-executor:test
