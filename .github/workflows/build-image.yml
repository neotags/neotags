name: Build Image

# Builds the neotags image (linux/amd64 + linux/arm64) and pushes it to GitHub Container Registry
# using the built-in GITHUB_TOKEN, then scans it with Trivy and fails on fixed HIGH/CRITICAL
# vulnerabilities. Runs on free GitHub-hosted runners (public repo).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (e.g., feature/my-branch)'
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      branch:
        required: false
        default: ''
        type: string
    outputs:
      image:
        description: Full image reference that was pushed (repository:tag)
        value: ${{ jobs.build.outputs.image }}
      tag:
        description: Image tag that was pushed
        value: ${{ jobs.build.outputs.tag }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Clone the current repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set image tag
        id: meta
        run: |
          GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          GIT_HASH=$(git rev-parse --short=7 HEAD)
          TAG="${GIT_TAG}-${GIT_HASH}"
          # GHCR requires a lowercase repository path
          REPO=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${REPO}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.meta.outputs.image }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # Post-push scan: the multi-arch build-push-action publishes in one step, so the image is
      # briefly available before the scan completes. Only fixed vulnerabilities fail the job;
      # unfixable noise is left to the GHCR/GitHub advisory views.
      - name: Scan image for fixed vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          platform: linux/amd64
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
