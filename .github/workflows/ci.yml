name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint deploy/helm/neotags --set image.repository=ghcr.io/neotags/neotags --set image.tag=ci
      - run: helm template neotags deploy/helm/neotags --set image.repository=ghcr.io/neotags/neotags --set image.tag=ci --set ingress.enabled=true > /dev/null
      - run: helm lint deploy/helm/neotags -f deploy/helm/neotags/ci/full-values.yaml
      - run: helm template neotags deploy/helm/neotags -f deploy/helm/neotags/ci/full-values.yaml > /dev/null

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Trivy and the sandbox tests for executor/ on amd64 and arm64; no push.
  # Pull requests only: on main, build-executor-image.yml runs the same checks
  # before it pushes.
  executor:
    name: executor
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/executor-check.yml

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Release downloads sometimes answer 5xx: retry instead of failing the run. Download to a file and check it
      # against the release's checksum before anything extracts it as root.
      - name: install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_checksums.txt
        run: |
          file="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${file}"
          echo "$SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$file" -C /usr/local/bin gitleaks

      - name: scan for secrets
        run: gitleaks git --config .gitleaks.toml --verbose .
