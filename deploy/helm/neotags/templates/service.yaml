apiVersion: v1
kind: Service
metadata:
  name: {{ include "neotags.fullname" . }}
  labels: {{- include "neotags.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "neotags.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if include "neotags.o2Enabled" . }}
    # In-cluster only: the Ingress routes /slack/events to the http port, never this one.
    - name: o2
      port: {{ include "neotags.o2ServicePort" . }}
      targetPort: o2
    {{- end }}
