# Create the Slack app from this manifest. Replace the request URL with your public ingress.
display_information:
  name: moose
features:
  bot_user:
    display_name: moose
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history   # read the thread to record (public channels only)
      - channels:read      # check the channel is public
      - chat:write
      - reactions:write
      - users:read         # resolve display names in the transcript
settings:
  event_subscriptions:
    request_url: https://neotags.example.com/slack/events
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true     # the Undo button
    request_url: https://neotags.example.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
