# Create the Slack app from this manifest. Replace the request URL with your public ingress.
display_information:
  name: moose
features:
  bot_user:
    display_name: moose
    always_online: true
oauth_config:
  scopes:
    bot:
      # Milestone 1 needs only these. Add channels:history, channels:read and users:read
      # when thread reading (kb-collect) lands.
      - app_mentions:read
      - chat:write
      - reactions:write
settings:
  event_subscriptions:
    request_url: https://neotags.example.com/slack/events
    bot_events:
      - app_mention
  # Enable interactivity (request_url .../slack/events) when buttons such as Undo land.
  org_deploy_enabled: false
  socket_mode_enabled: false
