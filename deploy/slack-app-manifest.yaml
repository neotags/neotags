# Create the Slack app from this manifest. Replace the request URL with your public ingress.
display_information:
  name: moose
features:
  app_home:
    messages_tab_enabled: true        # users can DM the bot
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: moose
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - im:read               # recognize the DM channel
      - im:history            # receive message.im and read the DM thread
      - channels:history   # read the thread to record (public channels)
      - channels:read      # check the channel type
      - groups:history     # only needed when slack.allowPrivateChannels is on
      - groups:read        # only needed when slack.allowPrivateChannels is on
      - files:read         # download attachments (PDF, Word, Excel, ...) to index them
      - chat:write
      - reactions:write
      - users:read         # resolve display names in the transcript
settings:
  event_subscriptions:
    request_url: https://neotags.example.com/slack/events
    bot_events:
      - app_mention
      - message.im           # direct messages to the bot
  interactivity:
    is_enabled: true     # the Undo button
    request_url: https://neotags.example.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
